name: Release

# Publish a GitHub Release with a built APK whenever a version tag is pushed.
#   git tag v0.1.0 && git push origin v0.1.0
# The release notes are taken from the matching "## [0.1.0]" section of CHANGELOG.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install SDK packages
        # sdkmanager is not on PATH on the runner image; use the preinstalled SDK's copy.
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      # Optional signing. Provide these repo secrets to get a signed APK:
      #   RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      # Without them the release APK is built unsigned (fine for sideloading dev builds).
      - name: Decode keystore
        id: keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: notes
        run: |
          version="${{ steps.ver.outputs.version }}"
          # Grab the section between "## [<version>]" and the next "## [" heading.
          # Literal prefix match: a dynamic regex like "^## \\[" ver is read differently by
          # gawk and mawk, and gawk turns it into a character class that never matches.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog section for $version; using generic notes."
            echo "Release $version" > release_notes.md
          fi
          echo "Release notes:"; cat release_notes.md

      - name: Assemble release APK
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$apk" || { echo "::error::No APK produced"; exit 1; }
          dest="leave-n-lock-${{ steps.ver.outputs.version }}.apk"
          cp "$apk" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Leave-N-Lock ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
